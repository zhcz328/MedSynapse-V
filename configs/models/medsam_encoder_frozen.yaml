encoder:
  name: "medsam3"
  type: "vit_b"
  # medsam3_external uses official MedSAM3/SAM3-LoRA text-guided masks for CCR.
  # The ViT-B checkpoint below is still used to produce the fixed spatial feature
  # tensor expected by MedSynapse-V's memory sampler.
  backend: "medsam3_external"
  pretrained_path: "checkpoints/medsam_vit_b.pth"

  medsam3:
    repo_dir: "external/MedSAM3"
    script_path: null
    config_path: "external/MedSAM3/configs/full_lora_config.yaml"
    lora_path: "checkpoints/MedSAM3_v1"
    prompt: "lesion"
    threshold: 0.5
    nms_iou: 0.5
    resolution: 1024
    cache_dir: "cache/medsam3_masks"
    python: "python3"
    timeout_s: 300

  architecture:
    image_size: 1024
    patch_size: 16
    embed_dim: 768
    depth: 12
    num_heads: 12
    mlp_ratio: 4.0
    out_chans: 256

  feature_extraction:
    output_spatial: [64, 64]
    output_channels: 1024
    hook_layer: "neck"
    flatten_spatial: true     # M = 64*64 = 4096 tokens

  segmentation_head:
    mask_threshold: 0.7
    max_masks: 3
    min_mask_area: 100
    use_top1_mask: true

  preprocessing:
    target_size: 1024
    pixel_mean: [123.675, 116.28, 103.53]
    pixel_std: [58.395, 57.12, 57.375]

  frozen: true
